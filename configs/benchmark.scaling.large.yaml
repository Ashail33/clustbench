# Large-n scaling sweep (validity rerun). The CI-sized sweeps stop at
# n=2000, where constant-cost phases make several algorithms look
# sub-linear. This sweep goes to n=50,000 on a convex and a non-convex
# family. Quadratic-memory/time methods carry a `max_n` cap; capped runs are
# logged as `skipped_*.json` artefacts rather than silently missing.
#
#   clustbench --config configs/benchmark.scaling.large.yaml --out runs/scaling_large
#   python scripts/build_site.py --run runs/scaling_large --out docs/data_scaling

datasets:
  - id: mdcgen
    n_samples: [1000, 3000, 10000, 30000, 50000]
    n_features: [10]
    k_targets: [5]
    compactness: [1.0]
    outliers: [0]
    noise: [0]
    density: [1.0]
  - id: moons
    n_samples: [1000, 3000, 10000, 30000, 50000]
    n_features: [2]
    k_targets: [2]
    compactness: [1.0]

algorithms:
  - {name: kmeans, kind: python, entry: kmeans, params: {max_iter: 100, n_init: 3}}
  - {name: minibatch_kmeans, kind: python, entry: minibatch_kmeans, params: {batch_size: 100, max_iter: 100}}
  - {name: parallel_kmeans, kind: python, entry: parallel_kmeans, params: {max_iter: 50, n_init: 2, n_workers: 1}}
  - {name: birch_algo, kind: python, entry: birch_algo, params: {threshold: 1.0}}
  - {name: bico_stream, kind: python, entry: bico_stream, params: {}}
  - {name: gmm, kind: python, entry: gmm, params: {max_iter: 100, n_init: 1}}
  - {name: dbscan_auto, kind: python, entry: dbscan_auto, params: {min_samples: 5}}
  - {name: louvain_knn, kind: python, entry: louvain_knn, params: {}}
  - {name: fmm, kind: python, entry: fmm, params: {n_frequencies: 64, n_scales: 3, max_iter: 40}, max_n: 30000}
  - {name: lmm, kind: python, entry: lmm, params: {}, max_n: 30000}
  - {name: spectral, kind: python, entry: spectral, params: {n_neighbors: 10}, max_n: 30000}
  - {name: aura_v3, kind: python, entry: aura_v3, params: {}, max_n: 30000}
  - {name: rapid, kind: python, entry: rapid, params: {}, max_n: 30000}
  - {name: clarans_pp, kind: python, entry: clarans_pp, params: {numlocal: 2, maxneigh: 80}, max_n: 30000}
  - {name: agglomerative, kind: python, entry: agglomerative, params: {linkage: ward}, max_n: 10000}
  - {name: meanshift_robust, kind: python, entry: meanshift_robust, params: {trim: 0.2, quantile: 0.2}, max_n: 10000}
  - {name: learned_router, kind: python, entry: learned_router, params: {}, max_n: 30000}
  - {name: optics, kind: python, entry: optics, params: {min_samples: 5, xi: 0.05}, max_n: 3000}

seeds: [1, 2]

strict_provenance: true
timing:
  repeats: 1
  threads: 1
  warmup: true
