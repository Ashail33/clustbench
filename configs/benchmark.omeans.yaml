algorithms:
- name: minibatch_kmeans
  kind: python
  entry: minibatch_kmeans
  params:
    batch_size: 100
    max_iter: 100
- name: kmeans
  kind: python
  entry: kmeans
  params:
    max_iter: 100
    n_init: 3
- name: mcg
  kind: python
  entry: mcg
  params: {}
- name: mcg_cf
  kind: python
  entry: mcg_cf
  params: {}
- name: lmm_mcg
  kind: python
  entry: lmm_mcg
  params: {}
- name: o_means
  kind: python
  entry: o_means
  params: {}
- name: mcg_omeans
  kind: python
  entry: mcg
  params:
    coarsen: omeans
- name: mcg_cf_omeans
  kind: python
  entry: mcg_cf
  params:
    coarsen: omeans
- name: lmm_mcg_omeans
  kind: python
  entry: lmm_mcg
  params:
    mcg_params:
      coarsen: omeans
seeds:
- 1
- 2
- 3
strict_provenance: true
timing:
  repeats: 1
  threads: 1
  warmup: true
  timeout_s: 120
resources:
  isolate: true
  memory_limit_gb: 3
