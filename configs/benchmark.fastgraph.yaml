# Fast graph clustering at large n: does an approximate (NN-descent) k-NN
# graph keep LMM's and spectral clustering's accuracy?
#
# lmm / spectral build the exact k-NN graph (O(n^2 d)); lmm_fast /
# spectral_fast build it with NN-descent once n >= 10k and d > 10. Eleven
# dataset families at d = 20, n = 20k and 100k, two seeds; exact spectral is
# capped at 20k (it does not finish 50k in 120 s, see docs/data_bigdata).
# GMM, mini-batch k-means and Trident are the fast reference points.
#
#   clustbench --config configs/benchmark.fastgraph.yaml --out runs/fastgraph
datasets:
- id: mdcgen
  n_samples:
  - 20000
  - 100000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: anisotropic
  n_samples:
  - 20000
  - 100000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: heavy_tailed_mixture
  n_samples:
  - 20000
  - 100000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: hierarchical_nested
  n_samples:
  - 20000
  - 100000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: VariableDensityBridges
  n_samples:
  - 20000
  - 100000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: inverse_pca
  n_samples:
  - 20000
  - 100000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: spiral
  n_samples:
  - 20000
  - 100000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: rings
  n_samples:
  - 20000
  - 100000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: moons
  n_samples:
