algorithms:
- name: minibatch_kmeans
  kind: python
  entry: minibatch_kmeans
  params:
    batch_size: 100
    max_iter: 100
- name: gmm
  kind: python
  entry: gmm
  params:
    max_iter: 100
    n_init: 1
- name: spectral
  kind: python
  entry: spectral
  params:
    n_neighbors: 10
  max_n: 20000
- name: lmm
  kind: python
  entry: lmm
  params: {}
- name: trident
  kind: python
  entry: trident
  params: {}
- name: lmm_fast
  kind: python
  entry: lmm_fast
  params: {}
- name: spectral_fast
  kind: python
  entry: spectral_fast
  params:
    n_neighbors: 10
seeds:
- 1
- 2
strict_provenance: true
timing:
  repeats: 1
  threads: 1
  warmup: true
  timeout_s: 300
resources:
  isolate: true
  memory_limit_gb: 4
