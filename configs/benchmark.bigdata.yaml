# Big-data scaling sweep: how does each algorithm's cost and quality grow
# with the number of points (n), features (d) and clusters (k)?
#
# One-factor-at-a-time from a base of n=10,000, d=20, k=10 (MDCGen blobs),
# plus one large corner (n=100k, d=100, k=50). Every algorithm gets a 120 s
# budget per run; each run executes in its own forked child that may allocate
# at most 3 GB and is hard-killed at the time limit, so runs that do not
# finish are recorded (error_type Timeout / MemoryError) instead of stalling
# or killing the sweep.
#
#   clustbench --config configs/benchmark.bigdata.yaml --out runs/bigdata
#   python scripts/scaling_report.py runs/bigdata
datasets:
- id: mdcgen
  n_samples:
  - 2000
  - 10000
  - 50000
  - 200000
  n_features:
  - 20
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: mdcgen
  n_samples:
  - 10000
  n_features:
  - 5
  - 100
  - 500
  k_targets:
  - 10
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: mdcgen
  n_samples:
  - 10000
  n_features:
  - 20
  k_targets:
  - 3
  - 50
  - 200
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
- id: mdcgen
  n_samples:
  - 100000
  n_features:
  - 100
  k_targets:
  - 50
  compactness:
  - 1.0
  outliers:
  - 0
  noise:
  - 0
  density:
  - 1.0
algorithms:
- name: parallel_kmeans
  kind: python
  entry: parallel_kmeans
  params:
    max_iter: 50
    n_init: 2
    n_workers: 1
- name: minibatch_kmeans
  kind: python
  entry: minibatch_kmeans
  params:
    batch_size: 100
    max_iter: 100
- name: pwcc
  kind: python
  entry: pwcc
  params:
    base:
    - kmeans
    - minibatch_kmeans
    - birch_algo
- name: s5c
  kind: python
  entry: s5c
  params:
    sample_size: 200
    n_nonzero_coefs: 5
- name: kmeans
  kind: python
  entry: kmeans
  params:
    max_iter: 100
    n_init: 3
- name: dbscan
  kind: python
  entry: dbscan
  params:
    eps: 0.8
    min_samples: 5
- name: birch_algo
  kind: python
  entry: birch_algo
  params:
    threshold: 1.0
- name: clarans
  kind: python
  entry: clarans
  params:
    numlocal: 2
    maxneigh: 30
- name: consensus
  kind: python
  entry: consensus
  params:
    base:
    - kmeans
    - minibatch_kmeans
    - birch_algo
- name: gmm
  kind: python
  entry: gmm
  params:
    max_iter: 100
    n_init: 1
- name: agglomerative
  kind: python
  entry: agglomerative
  params:
    linkage: ward
- name: spectral
  kind: python
  entry: spectral
  params:
    n_neighbors: 10
- name: meanshift
  kind: python
  entry: meanshift
  params:
    bin_seeding: true
- name: optics
  kind: python
  entry: optics
  params:
    min_samples: 5
    xi: 0.05
  max_n: 20000
- name: mri
  kind: python
  entry: mri
