# Every algorithm on every dataset family, with the emphasis on oddly shaped
# clusters and mixtures.
#
# * 20 synthetic shape / mixture families (moons, circles, rings, spirals,
#   S-curve, Swiss roll, mixed shapes, density bridges, nested, heavy tails,
#   imbalance, outliers, ...), n = 2000, each in its native low dimension
#   (2-D, or 3-D for the S-curve and Swiss roll) and padded to d = 10; rings
#   and spirals at k = 3 and 5.
# * Every real dataset in clustbench at (close to) native size and dimension:
#   iris, wine, breast cancer, digits, ecoli, glass, yeast, vehicle, segment,
#   Olivetti faces, 20 newsgroups, ECG200, Trace, karate club; plus the SBM
#   graph and synthetic time series.
# * Three seeds; 120 s and 3 GB per run, each run in its own process.
#
#   clustbench --config configs/benchmark.shapes.yaml --out runs/shapes
datasets:
- id: moons
  n_samples:
  - 2000
  n_features:
  - 2
  - 10
  k_targets:
  - 2
  compactness:
  - 1.0
